version: '3.9'
services:
  database:
    container_name: reserva_b_booking_management_db
    image: postgres:latest
    environment:
      POSTGRES_DB: "arqui_soft_code_factory"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"

  java-app:
    container_name: reserva_b_booking_management
    image: pee-reserva_b_booking_management:1.0.0
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://localhost:5432/arqui_soft_code_factory
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=123456
    depends_on:
      - database